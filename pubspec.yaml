name: medicine_reminder_app
description: "تطبيق التذكير بالدواء - يعمل بدون إنترنت"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # إشعارات ومنبهات محلية بالكامل (بدون إنترنت)
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0

  # قاعدة بيانات محلية على الجهاز
  sqflite: ^2.4.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
