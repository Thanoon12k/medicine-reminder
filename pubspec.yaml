name: medicine_reminder_app
description: "تطبيق التذكير بالدواء - يعمل بدون إنترنت"
publish_to: 'none'

# رقم البناء أعلى من نسخ split-per-abi السابقة (١٠٠١+) حتى لا يرفض
# أندرويد التحديث باعتباره تنزيلاً لإصدار أقدم.
version: 1.0.2+3001

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # إشعارات ومنبهات محلية بالكامل (بدون إنترنت)
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0

  # قاعدة بيانات محلية على الجهاز
  sqflite: ^2.4.3
  path: ^1.9.0

  # نطق عربي بمحرك الجهاز (يعمل أوفلاين إن كانت اللغة العربية مثبّتة)
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
