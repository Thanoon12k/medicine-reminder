name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/reliable-alarms-2026-10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build installable APK
        run: flutter build apk --release
      - name: Retain APK for download
        uses: actions/upload-artifact@v4
        with:
          name: dawaai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish downloadable APK on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.2 >/dev/null 2>&1 || gh release create v1.0.2 --target "$GITHUB_SHA" --title "دوائي v1.0.2" --notes "Alarm scheduling reliability improvements. APK signed with the CI debug key for testing."
          gh release upload v1.0.2 build/app/outputs/flutter-apk/app-release.apk --clobber
